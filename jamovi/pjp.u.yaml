title: Pj Editor +
name: Pjp
jus: '3.0'
compilerMode: tame
events:
  loaded: './main::loaded'
  update: './main::update'
children:
  - type: CustomControl
    name: pjpAccordion

  - type: VariableSupplier
    permitted:
      - factor
      - numeric
      - id
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Variables
        children:
          - type: VariablesListBox
            name: vars
            isTarget: true
            height: smallest
            ghostText: 'optional — becomes "data" in your code'
            events:
              change: ./main::onChange_vars

  - type: File
    name: scriptFile
    label: 'Service script (.py)'
