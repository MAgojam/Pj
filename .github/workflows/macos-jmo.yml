name: Build Pj macOS JMO

on:
  workflow_dispatch:
    inputs:
      native_source_asset_id:
        description: 'Authorised temporary encrypted source asset ID (native-only build; omit for JMO)'
        required: false
        type: string
      native_source_sha256:
        description: 'SHA256 of the authorised plaintext archive'
        required: false
        type: string
      native_cipher_sha256:
        description: 'SHA256 of the temporary encrypted archive'
        required: false
        type: string
  pull_request:
    paths:
      - '.github/workflows/macos-jmo.yml'
      - '.github/scripts/macos/**'
      - '.github/scripts/build-service-example.R'
      - 'tests/mzPj_service_host.R'
      - 'R/mzPj_python_service.R'
      - 'R/mzPj_process.R'
      - 'DESCRIPTION'
      - 'jamovi/0000.yaml'
      - 'tests/mzPj_process_runner.R'
      - 'tests/mzPj_service_process.R'
      - 'tests/mzPj_flatpak_process.R'
      - 'tests/mzPj_flatpak_cache.R'
      - 'R/mzPj_service_api.R'
      - 'inst/**'
      - '.github/scripts/prepare-native-jmo.py'
      - '.github/scripts/build-private-native.py'
      - 'tests/mzPj_native_libraries.py'
      - 'tests/mzPj_service_api.R'
      - 'tests/mzPj_preparation.R'
      - 'tests/mzPj_meta.py'
      - 'tests/mzPj_data.py'
      - 'tests/fixtures/**'
      - 'docs/examples/**'
      - 'tests/mzPj_macos_python.R'

permissions:
  contents: read

jobs:
  availability:
    name: Check precompiled macOS backends
    if: github.event_name != 'workflow_dispatch' || inputs.native_source_asset_id == ''
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.native.outputs.ready }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - id: native
        shell: bash
        run: |
          ready=true
          for arch in arm64 x86_64; do
            if test ! -f "inst/python/pj_stats_rust/macosx_$arch/pj_stats_rust.abi3.so"; then
              echo "Native macOS $arch binary pending; JMO build is skipped, not PASSED."
              ready=false
            fi
          done
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
  native:
    permissions:
      contents: write  # GitHub requires write permission to read an unpublished release asset.
    name: Private native macOS ${{ matrix.arch }}
    if: github.event_name == 'workflow_dispatch' && inputs.native_source_asset_id != ''
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: module
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Prepare Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Build and test authorised temporary private source
        env:
          GH_TOKEN: ${{ github.token }}
          PJ_PRIVATE_NATIVE_KEY_160: ${{ secrets.PJ_PRIVATE_NATIVE_KEY_160 }}
          PJ_NATIVE_SOURCE_ASSET: ${{ inputs.native_source_asset_id }}
          PJ_NATIVE_SOURCE_SHA256: ${{ inputs.native_source_sha256 }}
          PJ_NATIVE_CIPHER_SHA256: ${{ inputs.native_cipher_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "${{ matrix.arch }}"
          python3 -B module/.github/scripts/build-private-native.py module "$GITHUB_WORKSPACE/results-native"
      - uses: actions/upload-artifact@v4
        with:
          name: Pj-native-macos-${{ matrix.arch }}-1.1.0
          path: results-native/
          if-no-files-found: error
          retention-days: 7
  build:
    needs: availability
    if: needs.availability.outputs.ready == 'true'
    name: macOS ${{ matrix.arch }} - jamovi 28.18
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            download_arch: arm64
            sha256: c529eb4517c7e67537bcb3f7bbdcf8495ab1ec8adf1849d2eb4094072a2174d6
          - runner: macos-15-intel
            arch: x86_64
            download_arch: x64
            sha256: 7242a2effe65113fbe2e4e80ca6905b658d35f5c53d350f00dab1636e6011a73
    runs-on: ${{ matrix.runner }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      JAMOVI_VERSION: 28.18.0.0
      EXPECTED_ARCH: ${{ matrix.arch }}
      DMG_SHA256: ${{ matrix.sha256 }}
      SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          path: ci
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          path: module
          persist-credentials: false
      - name: Require the precompiled macOS native backend
        run: |
          set -euo pipefail
          python3 ci/.github/scripts/prepare-native-jmo.py module "macosx_$EXPECTED_ARCH"
      - name: Download and verify jamovi
        env:
          DOWNLOAD_ARCH: ${{ matrix.download_arch }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "$EXPECTED_ARCH"
          URL="https://www.jamovi.org/downloads/jamovi-${JAMOVI_VERSION}-macos-${DOWNLOAD_ARCH}.dmg"
          curl --fail --location --retry 3 --referer https://www.jamovi.org/download.html "$URL" -o "$RUNNER_TEMP/jamovi.dmg"
          printf '%s  %s\n' "$DMG_SHA256" "$RUNNER_TEMP/jamovi.dmg" | shasum -a 256 --check
          hdiutil verify "$RUNNER_TEMP/jamovi.dmg"
          mkdir -p "$RUNNER_TEMP/jamovi-mount"
          hdiutil attach "$RUNNER_TEMP/jamovi.dmg" -readonly -nobrowse -mountpoint "$RUNNER_TEMP/jamovi-mount"
          trap 'hdiutil detach "$RUNNER_TEMP/jamovi-mount"' EXIT
          ditto "$RUNNER_TEMP/jamovi-mount/jamovi.app" /Applications/jamovi.app
          test -x /Applications/jamovi.app/Contents/MacOS/jamovi
          RH=/Applications/jamovi.app/Contents/Frameworks/R.framework/Versions/Current/Resources
          test -x "$RH/bin/Rscript"
          echo "JAMOVI_R_HOME=$RH" >> "$GITHUB_ENV"
          mkdir -p "$GITHUB_WORKSPACE/results"
          sw_vers > "$GITHUB_WORKSPACE/results/environment.txt"
          uname -a >> "$GITHUB_WORKSPACE/results/environment.txt"
          file "$RH/bin/exec/R" >> "$GITHUB_WORKSPACE/results/environment.txt"
          lipo "$RH/bin/exec/R" -verify_arch "$EXPECTED_ARCH"
          sed -n '1,38p' "$RH/bin/R" >> "$GITHUB_WORKSPACE/results/environment.txt"
      - name: Prepare isolated System Python for numerical tests
        run: |
          python3 -m venv --copies "$RUNNER_TEMP/pj-system-python"
          "$RUNNER_TEMP/pj-system-python/bin/python3" -m pip install numpy scipy
          echo "$RUNNER_TEMP/pj-system-python/bin" >> "$GITHUB_PATH"
      - name: Test the precompiled native Rust loader
        run: |
          set -euo pipefail
          python3 -B module/tests/mzPj_native_libraries.py 2>&1 | tee results/native-loader.log
      - name: Compile with the embedded jamovi R
        run: |
          set -euo pipefail
          export R_HOME="$JAMOVI_R_HOME"
          export RHOME="$JAMOVI_R_HOME"
          "$R_HOME/bin/Rscript" --vanilla ci/.github/scripts/macos/build.R "$GITHUB_WORKSPACE/module" "$GITHUB_WORKSPACE/results" 2>&1 | tee results/build.log
      - name: Verify the JMO package
        run: python3 ci/.github/scripts/macos/verify.py module results "$EXPECTED_ARCH"
      - name: Test the compiled R and Python backends
        run: |
          set -euo pipefail
          export R_HOME="$JAMOVI_R_HOME"
          export RHOME="$JAMOVI_R_HOME"
          "$R_HOME/bin/Rscript" --vanilla ci/.github/scripts/macos/check.R "$GITHUB_WORKSPACE/module" "$GITHUB_WORKSPACE/results" 2>&1 | tee results/backend.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Pj-macos-${{ matrix.arch }}-jamovi28.18
          path: results/
          if-no-files-found: error
          retention-days: 14
